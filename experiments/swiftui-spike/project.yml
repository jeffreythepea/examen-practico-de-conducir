name: ExamenPracticoSpike
options:
  bundleIdPrefix: com.jeffreypease
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  ExamenPracticoSpike:
    type: application
    platform: iOS
    sources:
      - path: ExamenPracticoSpike
        excludes:
          - Resources
      - path: ExamenPracticoSpike/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeffreypease.ExamenPracticoSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  ExamenPracticoSpikeTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: ExamenPracticoSpike
    sources:
      - ExamenPracticoSpikeTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ExamenPracticoSpike
